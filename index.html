<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEON GH SBA - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin: 8px 0; font-size: 15px; }
        input:focus { outline: none; border-color: #0d47a1; box-shadow: 0 0 0 3px rgba(13,71,161,0.1); }
        button { width: 100%; padding: 13px; background: #0d47a1; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0b3c8c; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error { color: #ef4444; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-800 text-white mb-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-blue-800">LEON GH SBA</h1>
            <p class="text-gray-500 text-sm mt-1">School Based Assessment System</p>
            <p class="text-xs text-gray-400 mt-2">Secure Authentication Required</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="loginBtn">Sign In</button>
            <p id="errorMsg" class="error">Invalid username or password</p>
        </form>
        <div class="text-center mt-6 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-400">© 2026 Gbawe Gonse M/A Basic School</p>
            <p class="text-xs text-gray-400">Authorized personnel only</p>
        </div>
    </div>
    <script>
        const users = {
            'admin': { password: 'admin123', role: 'developer', name: 'System Administrator' },
            'headmaster': { password: 'school123', role: 'school_admin', name: 'School Administrator' },
            'teacher_b7': { password: 'class123', role: 'class_teacher', class: 'Basic 7', name: 'Basic 7 Teacher' },
            'math_teacher': { password: 'math123', role: 'subject_teacher', subject: 'Mathematics', name: 'Mathematics Teacher' }
        };
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            errorMsg.style.display = 'none';
            setTimeout(() => {
                const user = users[username];
                if (user && user.password === password) {
                    sessionStorage.setItem('leon_sba_user', JSON.stringify({ username: username, role: user.role, name: user.name, class: user.class || null, subject: user.subject || null }));
                    window.location.href = 'app.html';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    errorMsg.style.display = 'block';
                }
            }, 500);
        }
    </script>
</body>
</html>
